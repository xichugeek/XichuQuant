events { worker_connections 256; }
http {
  server_tokens off;
  client_max_body_size 2m;
  limit_req_zone $binary_remote_addr zone=local_api:10m rate=10r/s;
  server {
    listen 8080;
    location = /health { access_log off; return 200 'OK'; }
    location /api/ {
      limit_req zone=local_api burst=40 nodelay;
      proxy_pass http://api:5089/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
      proxy_pass http://web:5088;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
